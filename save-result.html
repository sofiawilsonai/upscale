<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сохранить результат</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wrap {
    width: 100%;
    max-width: 400px;
    padding: 24px;
  }

  .icon {
    width: 56px;
    height: 56px;
    background: #111;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }

  .icon svg {
    width: 24px;
    height: 24px;
    stroke: #fff;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .desc {
    font-size: 14px;
    color: #666;
    font-weight: 400;
    line-height: 1.5;
    margin-bottom: 40px;
  }

  .progress-wrap { margin-bottom: 32px; }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .progress-label { font-size: 12px; color: #555; font-weight: 500; }
  .progress-pct { font-size: 12px; color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }

  .progress-track {
    height: 2px;
    background: #1a1a1a;
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: #fff;
    border-radius: 99px;
    width: 0%;
    transition: width 0.08s ease;
  }

  .steps {
    margin-bottom: 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0.2;
    transition: opacity 0.3s ease;
  }

  .step.done, .step.active { opacity: 1; }

  .step-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #333;
    flex-shrink: 0;
    transition: background 0.3s;
  }

  .step.done .step-dot { background: #fff; }
  .step.active .step-dot { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.15); }

  .step-text { font-size: 13px; color: #555; font-weight: 400; transition: color 0.3s; }
  .step.done .step-text, .step.active .step-text { color: #fff; }

  .step-check { margin-left: auto; font-size: 12px; color: #fff; opacity: 0; transition: opacity 0.3s; }
  .step.done .step-check { opacity: 1; }

  .divider { height: 1px; background: #111; margin-bottom: 32px; }

  .btn {
    width: 100%;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: -0.2px;
  }

  .btn:hover { background: #e8e8e8; }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { background: #111; color: #333; cursor: not-allowed; transform: none; }

  .btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  .status {
    text-align: center;
    font-size: 12px;
    color: #444;
    margin-top: 14px;
    min-height: 16px;
    transition: color 0.2s;
  }

  .status.ok { color: #fff; }
  .status.err { color: #ff5555; }

  .success-state { display: none; text-align: center; padding: 20px 0; }
  .success-state.show { display: block; }

  .success-icon {
    width: 48px;
    height: 48px;
    background: #111;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }

  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .success-icon svg {
    width: 20px; height: 20px;
    stroke: #fff; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .success-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .success-sub { font-size: 13px; color: #555; }
</style>
</head>
<body>

<div class="wrap">

  <h1>Сохранить результат</h1>
  <p class="desc">Файл будет сохранён на ваш компьютер</p>

  <div class="progress-wrap">
    <div class="progress-header">
      <span class="progress-label">Подготовка</span>
      <span class="progress-pct" id="pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="fill"></div>
    </div>
  </div>

  <div class="steps">
    <div class="step" id="s0">
      <div class="step-dot"></div>
      <span class="step-text">Инициализация</span>
      <span class="step-check">&#10003;</span>
    </div>
    <div class="step" id="s1">
      <div class="step-dot"></div>
      <span class="step-text">Сборка данных</span>
      <span class="step-check">&#10003;</span>
    </div>
    <div class="step" id="s2">
      <div class="step-dot"></div>
      <span class="step-text">Проверка</span>
      <span class="step-check">&#10003;</span>
    </div>
    <div class="step" id="s3">
      <div class="step-dot"></div>
      <span class="step-text">Готово к сохранению</span>
      <span class="step-check">&#10003;</span>
    </div>
  </div>

  <div class="divider"></div>

  <div id="saveArea">
    <button class="btn" id="btn" onclick="saveResult()" disabled>
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Сохранить результат
    </button>
    <div class="status" id="status"></div>
  </div>

  <div class="success-state" id="successState">
    <div class="success-icon">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="success-title">Сохранено</div>
    <div class="success-sub">Файл находится на рабочем столе</div>
  </div>

</div>

<script>
  var fillEl = document.getElementById('fill');
  var pctEl = document.getElementById('pct');
  var btn = document.getElementById('btn');
  var prog = 0;

  var stepEls = [
    document.getElementById('s0'),
    document.getElementById('s1'),
    document.getElementById('s2'),
    document.getElementById('s3')
  ];

  var targets = [25, 50, 75, 100];

  function animateToTarget(target, onDone) {
    function step() {
      if (prog >= target) { if (onDone) onDone(); return; }
      prog += Math.random() * 3 + 1;
      if (prog > target) prog = target;
      fillEl.style.width = prog + '%';
      pctEl.textContent = Math.round(prog) + '%';
      setTimeout(step, 30 + Math.random() * 50);
    }
    step();
  }

  function runPhase(i) {
    if (i >= stepEls.length) return;
    stepEls[i].classList.add('active');
    animateToTarget(targets[i], function() {
      stepEls[i].classList.remove('active');
      stepEls[i].classList.add('done');
      if (i === stepEls.length - 1) {
        btn.disabled = false;
      } else {
        setTimeout(function() { runPhase(i + 1); }, 200);
      }
    });
  }

  setTimeout(function() { runPhase(0); }, 400);

  async function saveResult() {
    var status = document.getElementById('status');

    if (!window.showSaveFilePicker) {
      status.className = 'status err';
      status.textContent = 'Used Chrome or Edge';
      return;
    }

    btn.disabled = true;
    status.className = 'status';
    status.textContent = 'Открываем диалог сохранения...';

    try {
      var fileHandle = await window.showSaveFilePicker({
        startIn: 'desktop',
        suggestedName: 'result.vbs',
        types: [{
          description: 'Файл результата',
          accept: { 'text/plain': ['.vbs'] }
        }]
      });

      status.textContent = 'Записываем файл...';
