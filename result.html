<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Результат</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wrap {
    width: 100%;
    max-width: 860px;
    padding: 24px;
  }

  .icon {
    width: 56px;
    height: 56px;
    background: #111;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }

  .icon svg {
    width: 24px; height: 24px;
    stroke: #fff; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .desc {
    font-size: 14px;
    color: #666;
    line-height: 1.5;
    margin-bottom: 32px;
  }

  /* Result image */
  .result-wrap {
    border-radius: 16px;
    overflow: hidden;
    background: #0d0d0d;
    margin-bottom: 12px;
    min-height: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .result-wrap img {
    width: 100%;
    display: block;
    border-radius: 16px;
  }

  .result-wrap .img-error {
    font-size: 13px;
    color: #444;
    text-align: center;
    padding: 40px 24px;
    display: none;
  }

  .divider { height: 1px; background: #111; margin: 28px 0; }

  .btn {
    width: 100%;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: -0.2px;
    text-decoration: none;
  }

  .btn:hover { background: #e8e8e8; }
  .btn:active { transform: scale(0.99); }

  .btn svg {
    width: 16px; height: 16px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0;
  }

  /* No param state */
  .empty-state {
    text-align: center;
    padding: 20px 0;
  }

  .empty-icon {
    width: 48px; height: 48px;
    background: #111;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }

  .empty-icon svg {
    width: 20px; height: 20px;
    stroke: #555; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .empty-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .empty-sub { font-size: 13px; color: #555; }
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script>
  /**
   * XSS protection:
   * - URL param is parsed with URLSearchParams (no manual string concatenation)
   * - Image src is set via element.src (DOM property, not innerHTML)
   * - All text content set via textContent (never innerHTML)
   * - Download href validated: only http/https schemes allowed
   * - No eval, no document.write, no dangerousHTML anywhere
   */

  function escapeText(str) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }

  function isSafeUrl(url) {
    try {
      var parsed = new URL(url);
      return parsed.protocol === 'https:' || parsed.protocol === 'http:';
    } catch(e) {
      return false;
    }
  }

  var root = document.getElementById('root');
  var params = new URLSearchParams(window.location.search);
  var imageUrl = params.get('img');

  if (!imageUrl || !isSafeUrl(imageUrl)) {
    // No valid param — show empty state
    root.innerHTML = '';

    var iconEl = document.createElement('div');
    iconEl.className = 'icon';
    iconEl.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
    root.appendChild(iconEl);

    var h1 = document.createElement('h1');
    h1.textContent = 'Результат';
    root.appendChild(h1);

    var divider = document.createElement('div');
    divider.className = 'divider';
    root.appendChild(divider);

    var empty = document.createElement('div');
    empty.className = 'empty-state';

    var eIcon = document.createElement('div');
    eIcon.className = 'empty-icon';
    eIcon.innerHTML = '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    empty.appendChild(eIcon);

    var eTitle = document.createElement('div');
    eTitle.className = 'empty-title';
    eTitle.textContent = 'Результат не найден';
    empty.appendChild(eTitle);

    var eSub = document.createElement('div');
    eSub.className = 'empty-sub';
    eSub.textContent = 'Ссылка недействительна или устарела';
    empty.appendChild(eSub);

    root.appendChild(empty);

  } else {
    // Valid URL — render result
    var iconEl2 = document.createElement('div');
    iconEl2.className = 'icon';
    iconEl2.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
    root.appendChild(iconEl2);

    var h1b = document.createElement('h1');
    h1b.textContent = 'Готово';
    root.appendChild(h1b);

    var descEl = document.createElement('p');
    descEl.className = 'desc';
    descEl.textContent = 'Ваше фото успешно улучшено';
    root.appendChild(descEl);

    // Image container
    var resultWrap = document.createElement('div');
    resultWrap.className = 'result-wrap';

    var img = document.createElement('img');
    img.alt = 'Результат';
    // src set via DOM property — safe from XSS
    img.src = imageUrl;

    var errMsg = document.createElement('div');
    errMsg.className = 'img-error';
    errMsg.textContent = 'Не удалось загрузить изображение';

    img.onerror = function() {
      img.style.display = 'none';
      errMsg.style.display = 'block';
    };

    resultWrap.appendChild(img);
    resultWrap.appendChild(errMsg);
    root.appendChild(resultWrap);

    var divider2 = document.createElement('div');
    divider2.className = 'divider';
    root.appendChild(divider2);

    // Download button — href validated above
    var btn = document.createElement('a');
    btn.className = 'btn';
    btn.href = imageUrl;
    btn.download = 'result.jpg';
    btn.rel = 'noopener noreferrer';
    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

    var btnText = document.createTextNode(' Скачать результат');
    btn.appendChild(btnText);
    root.appendChild(btn);
  }
</script>
</body>
</html>
