<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Загрузка</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
 
  body {
    background: #000;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
 
  .wrap {
    width: 100%;
    max-width: 400px;
    padding: 24px;
  }
 
  .icon {
    width: 56px;
    height: 56px;
    background: #111;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
 
  .icon svg {
    width: 24px; height: 24px;
    stroke: #fff; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
 
  h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin-bottom: 8px;
  }
 
  .desc {
    font-size: 14px;
    color: #666;
    line-height: 1.5;
    margin-bottom: 40px;
  }
 
  .spinner-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 40px;
  }
 
  .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid #1a1a1a;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
 
  @keyframes spin { to { transform: rotate(360deg); } }
 
  .divider { height: 1px; background: #111; margin-bottom: 32px; }
 
  .error-state { display: none; text-align: center; }
  .error-state.show { display: block; }
 
  .error-icon {
    width: 48px; height: 48px;
    background: #111;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }
 
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
 
  .error-icon svg {
    width: 20px; height: 20px;
    stroke: #fff; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
 
  .error-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .error-sub { font-size: 13px; color: #555; line-height: 1.5; }
 
  .btn-retry {
    margin-top: 28px;
    width: 100%;
    background: #111;
    color: #fff;
    border: 1.5px solid #222;
    border-radius: 12px;
    padding: 15px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
 
  .btn-retry:hover { border-color: #444; background: #0f0f0f; }
</style>
</head>
<body>
<div class="wrap">
 
  <div class="icon">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
  </div>
 
  <h1 id="title">Обработка</h1>
  <p class="desc" id="desc">Пожалуйста, не закрывайте страницу</p>
 
  <div class="spinner-wrap" id="spinnerWrap">
    <div class="spinner"></div>
  </div>
 
  <div class="divider"></div>
 
  <div class="error-state" id="errorState">
    <div class="error-icon">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <div class="error-title">Попробуйте позже</div>
    <div class="error-sub"><br>Повторите попытку через несколько минут.</div>
    <button class="btn-retry" onclick="location.reload()">Попробовать снова</button>
  </div>
 
</div>
<script>
  setTimeout(function() {
    document.getElementById('spinnerWrap').style.display = 'none';
    document.getElementById('title').textContent = 'Ошибка';
    document.getElementById('desc').textContent = 'Не удалось обработать запрос';
    document.getElementById('errorState').classList.add('show');
  }, 30000);
</script>
</body>
</html>
