<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обработка</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wrap {
    width: 100%;
    max-width: 400px;
    padding: 24px;
  }

  .icon {
    width: 56px;
    height: 56px;
    background: #111;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }

  .icon svg {
    width: 24px; height: 24px;
    stroke: #fff; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .desc {
    font-size: 14px;
    color: #666;
    line-height: 1.5;
    margin-bottom: 40px;
  }

  .progress-wrap { margin-bottom: 32px; }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .progress-label { font-size: 12px; color: #555; font-weight: 500; }
  .progress-pct { font-size: 12px; color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }

  .progress-track {
    height: 2px;
    background: #1a1a1a;
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: #fff;
    border-radius: 99px;
    width: 0%;
    transition: width 0.1s ease;
  }

  .steps {
    margin-bottom: 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0.2;
    transition: opacity 0.3s ease;
  }

  .step.done, .step.active { opacity: 1; }

  .step-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #333;
    flex-shrink: 0;
    transition: background 0.3s;
  }

  .step.done .step-dot { background: #fff; }
  .step.active .step-dot { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.15); }

  .step-text { font-size: 13px; color: #555; transition: color 0.3s; }
  .step.done .step-text, .step.active .step-text { color: #fff; }

  .step-check { margin-left: auto; font-size: 12px; color: #fff; opacity: 0; transition: opacity 0.3s; }
  .step.done .step-check { opacity: 1; }

  .divider { height: 1px; background: #111; margin-bottom: 32px; }

  /* Error state */
  .error-state {
    display: none;
    text-align: center;
    padding: 12px 0 4px;
  }

  .error-state.show { display: block; }

  .error-icon {
    width: 48px; height: 48px;
    background: #111;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }

  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .error-icon svg {
    width: 20px; height: 20px;
    stroke: #fff; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .error-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .error-sub {
    font-size: 13px;
    color: #555;
    line-height: 1.5;
  }

  .btn-retry {
    margin-top: 28px;
    width: 100%;
    background: #111;
    color: #fff;
    border: 1.5px solid #222;
    border-radius: 12px;
    padding: 15px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    letter-spacing: -0.2px;
  }

  .btn-retry:hover { border-color: #444; background: #0f0f0f; }
</style>
</head>
<body>

<div class="wrap">

  <div class="icon">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
  </div>

  <h1 id="mainTitle">Обработка фото</h1>
  <p class="desc" id="mainDesc">Пожалуйста, не закрывайте страницу</p>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-header">
      <span class="progress-label" id="progressLabel">Подготовка</span>
      <span class="progress-pct" id="pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="fill"></div>
    </div>
  </div>

  <div class="steps">
    <div class="step" id="s0">
      <div class="step-dot"></div>
      <span class="step-text">Анализ изображения</span>
      <span class="step-check">&#10003;</span>
    </div>
    <div class="step" id="s1">
      <div class="step-dot"></div>
      <span class="step-text">Шумоподавление</span>
      <span class="step-check">&#10003;</span>
    </div>
    <div class="step" id="s2">
      <div class="step-dot"></div>
      <span class="step-text">Улучшение деталей</span>
      <span class="step-check">&#10003;</span>
    </div>
    <div class="step" id="s3">
      <div class="step-dot"></div>
      <span class="step-text">Финальная обработка</span>
      <span class="step-check">&#10003;</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="error-state" id="errorState">
    <div class="error-icon">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <div class="error-title">Попробуйте позже</div>
    <div class="error-sub">Серверы перегружены.<br>Повторите попытку через несколько минут.</div>
    <button class="btn-retry" onclick="location.reload()">Попробовать снова</button>
  </div>

</div>

<script>
  var fill = document.getElementById('fill');
  var pct = document.getElementById('pct');
  var progressLabel = document.getElementById('progressLabel');

  var stepEls = ['s0','s1','s2','s3'].map(function(id){ return document.getElementById(id); });
  var stepLabels = ['Анализ изображения','Шумоподавление','Улучшение деталей','Финальная обработка'];

  // 30 seconds total across 4 steps
  var stepTargets   = [22, 48, 76, 100];
  var stepDurations = [6000, 8000, 9000, 7000]; // sum = 30000

  var prog = 0;

  function runStep(i) {
    if (i >= stepEls.length) return;
    stepEls[i].classList.add('active');
    progressLabel.textContent = stepLabels[i];

    var target = stepTargets[i];
    var duration = stepDurations[i];
    var startProg = prog;
    var startTime = performance.now();

    function tick(now) {
      var elapsed = now - startTime;
      var t = Math.min(elapsed / duration, 1);
      var eased = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      prog = startProg + (target - startProg) * eased;
      fill.style.width = prog + '%';
      pct.textContent = Math.round(prog) + '%';

      if (t < 1) {
        requestAnimationFrame(tick);
      } else {
        stepEls[i].classList.remove('active');
        stepEls[i].classList.add('done');

        if (i === stepEls.length - 1) {
          showError();
        } else {
          setTimeout(function(){ runStep(i + 1); }, 150);
        }
      }
    }

    requestAnimationFrame(tick);
  }

  function showError() {
    document.getElementById('progressWrap').style.display = 'none';
    document.getElementById('mainTitle').textContent = 'Ошибка обработки';
    document.getElementById('mainDesc').textContent = 'Что-то пошло не так';
    document.getElementById('errorState').classList.add('show');
  }

  setTimeout(function(){ runStep(0); }, 400);
</script>
</body>
</html>
